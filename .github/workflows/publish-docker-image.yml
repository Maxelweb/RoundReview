name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read application version
        id: version
        run: |
          set -euo pipefail

          extract_version() {
            sed -nE 's/^[[:space:]]*VERSION[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p'
          }

          current_version="$(extract_version < app/config.py)"
          if [[ ! "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9a-z-]+(\.[0-9a-z-]+)*)?(\+[0-9a-z-]+(\.[0-9a-z-]+)*)?$ ]]; then
            echo "::error::app/config.py must define VERSION as a valid semantic version"
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$current_version" ]]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match VERSION '$current_version' in app/config.py"
            exit 1
          fi

          echo "version=$current_version" >> "$GITHUB_OUTPUT"

          latest_stable_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[0-9a-z-]+(\.[0-9a-z-]+)*)?$ ]]; then
              latest_stable_tag="$candidate"
              break
            fi
          done < <(git tag --list 'v[0-9]*' --sort=-version:refname)

          if [[ "$GITHUB_REF_NAME" == "$latest_stable_tag" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize image name
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker_version="${VERSION//+/_}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$image:$docker_version"
            if [[ "$LATEST" == "true" ]]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
