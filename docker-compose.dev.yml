name: RoundReview_DevStack

services:
  roundreview_app:
    container_name: "roundreview_app"
    build: .
    restart: unless-stopped
    ports: 
      - "8080:8080"
    volumes:
      - rr_sessions:/app/flask_session:rw
      - ./database:/app/database:rw
      - ./app:/app/app
    env_file:
      - ./envs/rr-app.env

volumes:
  rr_sessions: