name: RoundReview_Stack

services:
  roundreview_app:
    container_name: "roundreview_app"
    build: .
    restart: unless-stopped
    ports: 
      - "8080:8080"
    volumes:
      - rr_sessions:/app/flask_session:rw
      - rr_database:/app/database:rw
    env_file:
      - ./envs/rr-app.env

volumes:
  rr_sessions:
  rr_database: